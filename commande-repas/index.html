<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Commande repas — SAJ Anagallis</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <header class="app-header no-print">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">✣</div>
      <div>
        <div class="brand-title">SAJ Anagallis</div>
        <div class="brand-subtitle">Les Tourrais - Craponne</div>
      </div>
    </div>

    <div class="page-title-block">
      <div class="title-icon" aria-hidden="true">🍴</div>
      <div>
        <h1>Commande repas</h1>
        <p>Bien manger aujourd'hui, avec vous !</p>
      </div>
    </div>

    <nav class="top-tabs" aria-label="Navigation du widget">
      <button class="top-tab active" type="button" data-view="commande"><span class="tab-icon">♨</span><span>Commande repas</span></button>
      <button class="top-tab" type="button" data-view="habituelle"><span class="tab-icon">▦</span><span>Semaine habituelle</span></button>
      <button class="top-tab" type="button" data-view="historique"><span class="tab-icon">◴</span><span>Historique</span></button>
      <button class="top-tab" type="button" data-view="parametres"><span class="tab-icon">⚙</span><span>Paramètres</span></button>
      <button class="top-tab" type="button" data-view="aide"><span class="tab-icon">?</span><span>Aide</span></button>
    </nav>

    <div class="header-logo-wrap" title="Déposez votre logo sous le nom logo.png dans le même dossier GitHub">
      <img id="headerLogo" src="logo.png" alt="Logo" onerror="this.classList.add('logo-missing')">
      <span class="logo-fallback">LOGO</span>
    </div>
  </header>

  <main class="app-main">
    <section class="control-panel no-print">
      <div class="week-picker-block">
        <div class="panel-label">Sélection de la semaine</div>
        <div class="week-picker">
          <button id="prevWeek" class="arrow-btn" type="button" aria-label="Semaine précédente">‹</button>
          <div class="week-display">
            <strong id="weekRange">—</strong>
            <span id="weekNumber">—</span>
          </div>
          <button id="nextWeek" class="arrow-btn" type="button" aria-label="Semaine suivante">›</button>
        </div>
      </div>

      <div class="field-block">
        <label for="yearSelect">Année</label>
        <select id="yearSelect"></select>
      </div>

      <div class="field-block week-select-block">
        <label for="weekSelect">Semaine</label>
        <select id="weekSelect"></select>
      </div>

      <div class="field-block status-block">
        <label for="statusSelect">Statut</label>
        <select id="statusSelect">
          <option>À préparer</option>
          <option>Vérifiée</option>
          <option>Commandée</option>
          <option>Archivée</option>
        </select>
      </div>

      <div class="action-block">
        <button id="saveBtn" class="action-btn save-btn" type="button"><span>✓</span>Enregistrer</button>
        <button id="printBtn" class="action-btn print-btn" type="button"><span>▣</span>Imprimer</button>
        <button id="pdfBtn" class="action-btn pdf-btn" type="button"><span>PDF</span>Créer le PDF</button>
        <button id="mailBtn" class="action-btn mail-btn" type="button"><span>✉</span>Préparer l'e-mail Outlook</button>
      </div>
    </section>

    <section class="work-row no-print">
      <button id="verifyBtn" class="verify-btn" type="button"><span>⌕</span>Vérifier la commande</button>
      <button id="absenceBtn" class="absence-btn" type="button"><span>♟</span>Absence exceptionnelle</button>
      <label class="comment-field">
        <span>Commentaires pour la cuisine <small>(facultatif)</small></span>
        <input id="kitchenComment" type="text" placeholder="Ajouter un commentaire…">
      </label>
    </section>

    <div id="message" class="message no-print" hidden></div>

    <section id="editor" class="editor-area"></section>
  </main>

  <footer class="app-footer no-print">
    <span>SAJ Anagallis - Les Tourrais - Craponne</span>
    <span id="footerYear">Commande repas</span>
  </footer>

  <dialog id="absenceDialog">
    <form id="absenceForm" method="dialog">
      <h3>Absence exceptionnelle</h3>
      <label>Personne
        <select id="absencePerson" required></select>
      </label>
      <fieldset>
        <legend>Jour(s) concerné(s)</legend>
        <div id="absenceDays" class="day-checks"></div>
      </fieldset>
      <div class="dialog-actions">
        <button value="cancel" type="button" class="secondary-btn" id="cancelAbsence">Annuler</button>
        <button value="default" type="submit" class="primary-dialog-btn">Appliquer l'absence</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
